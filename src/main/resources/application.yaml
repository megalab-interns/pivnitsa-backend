server:
  forward-headers-strategy: framework
  port: ${PORT:8080}

spring:
  application:
    name: pivnitsa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pivnitsa}
    username: ${DB_USERNAME:pivnitsa}
    password: ${DB_PASSWORD:pivnitsa}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      connect-timeout: 10s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

otp:
  nikita:
    enabled: ${NIKITA_OTP_ENABLED:false}
    api-url: ${NIKITA_API_URL:https://smspro.nikita.kg/api/message}
    login: ${NIKITA_LOGIN:}
    password: ${NIKITA_PASSWORD:}
    sender: ${NIKITA_SENDER:SMSPRO.KG}
  infobip:
    enabled: ${INFOBIP_OTP_ENABLED:false}
    base-url: ${INFOBIP_BASE_URL:}
    api-key: ${INFOBIP_API_KEY:}
    sender: ${INFOBIP_SENDER:Pivnitsa}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
app:
  manual-payment:
    payment-window: ${MANUAL_PAYMENT_WINDOW:15m}
    qr-image-url: ${MANUAL_PAYMENT_QR_IMAGE_URL:}
    whatsapp-number: 996508787154
  s3:
    bucket-name: ${S3_BUCKET_NAME:pivnitsa-media-local}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY:GK1234567890abcdef12345678}
    secret-key: ${S3_SECRET_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    endpoint: ${S3_ENDPOINT:http://garage_s3:3900}
    public-url: ${S3_PUBLIC_URL:http://pivnitsa-media-local.localhost:3902}
  initial-owner:
    email: ${INITIAL_OWNER_EMAIL:}
    password: ${INITIAL_OWNER_PASSWORD:}
    full-name: ${INITIAL_OWNER_FULL_NAME:Owner}
  mobile:
    canonicalUrl: ${MOBILE_CANONICAL_URL:https://www.localhost/events/}
    #   deep link prefix example - app://
    deep-link-prefix: ${MOBILE_DEEP_LINK_PREFIX:app://}
    ios-store: ${MOBILE_IOS_STORE:https://apps.apple.com/app/youtube/id544007664}
    android-store: ${MOBILE_ANDROID_STORE:https://play.google.com/store/apps/details?id=com.google.android.youtube}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}
